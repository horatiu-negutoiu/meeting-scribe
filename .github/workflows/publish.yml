name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build release artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install locked development dependencies
        run: uv sync --extra dev --locked

      - name: Verify tag matches the package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(uv run python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$tag_version" = "$package_version"

      - name: Run tests
        run: uv run pytest

      - name: Build distribution packages
        run: uv build --out-dir dist

      - name: Validate package metadata and README rendering
        run: uv run --with twine twine check dist/*

      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish release artifacts to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Wait for and smoke-test the TestPyPI release
        shell: bash
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          timeout_seconds=180
          retry_interval_seconds=10
          started_at=$SECONDS
          attempt=1

          python -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'

          while :; do
            elapsed_seconds=$((SECONDS - started_at))
            remaining_seconds=$((timeout_seconds - elapsed_seconds))
            if (( remaining_seconds <= 0 )); then
              echo "::error title=TestPyPI smoke test timed out::meeting-transcribe==${package_version} was not installable from TestPyPI after ${timeout_seconds} seconds."
              exit 1
            fi

            smoke_test_venv="$(mktemp -d)"
            trap 'rm -rf "$smoke_test_venv"' EXIT
            echo "TestPyPI install attempt ${attempt}: waiting up to ${remaining_seconds}s for meeting-transcribe==${package_version}."
            python -m venv "$smoke_test_venv"

            if timeout "${remaining_seconds}s" "$smoke_test_venv/bin/python" -m pip install \
              --no-cache-dir \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "meeting-transcribe==${package_version}"; then
              echo "TestPyPI install attempt ${attempt} succeeded."
              "$smoke_test_venv/bin/meeting-scribe" --help
              exit 0
            fi

            rm -rf "$smoke_test_venv"
            trap - EXIT
            elapsed_seconds=$((SECONDS - started_at))
            remaining_seconds=$((timeout_seconds - elapsed_seconds))
            if (( remaining_seconds <= 0 )); then
              echo "::error title=TestPyPI smoke test timed out::meeting-transcribe==${package_version} was not installable from TestPyPI after ${timeout_seconds} seconds."
              exit 1
            fi

            sleep_seconds=$retry_interval_seconds
            if (( sleep_seconds > remaining_seconds )); then
              sleep_seconds=$remaining_seconds
            fi
            echo "TestPyPI install attempt ${attempt} failed; retrying in ${sleep_seconds}s (${remaining_seconds}s remain)."
            sleep "$sleep_seconds"
            ((attempt += 1))
          done

  publish-pypi:
    name: Publish release artifacts to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Confirm the PyPI project name remains available
        shell: bash
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            https://pypi.org/pypi/meeting-transcribe/json)"
          test "$status" = "404"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
