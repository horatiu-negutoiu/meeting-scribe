name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build release artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install locked development dependencies
        run: uv sync --extra dev --locked

      - name: Verify tag matches the package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(uv run python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$tag_version" = "$package_version"

      - name: Run tests
        run: uv run pytest

      - name: Build distribution packages
        run: uv build --out-dir dist

      - name: Validate package metadata and README rendering
        run: uv run --with twine twine check dist/*

      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish release artifacts to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Install the TestPyPI release in a clean environment
        shell: bash
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          python -m venv smoke-test-venv
          smoke-test-venv/bin/python -m pip install --upgrade pip
          smoke-test-venv/bin/python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "meeting-transcribe==${package_version}"
          smoke-test-venv/bin/meeting-scribe --help

  publish-pypi:
    name: Publish release artifacts to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Confirm the PyPI project name remains available
        shell: bash
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            https://pypi.org/pypi/meeting-transcribe/json)"
          test "$status" = "404"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
